[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filecraft"
version = "0.1.0"
description = "High-performance filesystem and disk usage craft workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
filecraft-cli = "filecraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filecraft"]
